<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14; --panel:#0d121b; --line:#1c2534; --ink:#e6ecf5; --muted:#7d8aa0;
    --ai:#a78bfa; --orch:#2dd4bf; --human:#f59e0b; --signal:#93a3bd; --output:#34d399; --loop:#f5b942;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  #app{display:flex;height:100vh;width:100vw}
  #stage{position:relative;flex:1 1 auto;min-width:0;height:100%}
  svg{display:block;width:100%;height:100%}

  /* legend */
  #legend{position:absolute;top:12px;right:14px;z-index:5;background:rgba(13,18,27,.82);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;backdrop-filter:blur(4px)}
  #legend .lt{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  #legend .row{display:flex;gap:14px;flex-wrap:wrap}
  #legend .k{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;
    font-size:9.5px;color:#c3ccdb}
  #legend .dot{width:9px;height:9px;border-radius:3px}

  /* title */
  #title{position:absolute;top:12px;left:16px;z-index:5}
  #title h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
  #title p{margin:2px 0 0;font-family:'JetBrains Mono',monospace;font-size:9.5px;
    color:var(--muted);letter-spacing:.04em}

  /* sidebar */
  #side{flex:0 0 288px;height:100%;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column}
  #side .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #side .hd .cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;
    color:var(--muted);text-transform:uppercase}
  #side .hd h2{margin:4px 0 0;font-size:14px;font-weight:600}
  #flows{padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
  .flowbtn{text-align:left;background:#0f1521;border:1px solid var(--line);border-radius:8px;
    padding:8px 11px;color:var(--ink);cursor:pointer;font-family:inherit;transition:.18s;
    display:flex;align-items:center;gap:9px}
  .flowbtn:hover{border-color:#33415a;background:#121a28}
  .flowbtn.on{border-color:var(--accent,#a78bfa);background:#141d2b;
    box-shadow:0 0 0 1px var(--accent,#a78bfa) inset}
  .flowbtn .idx{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);width:14px}
  .flowbtn .nm{font-size:12.5px;font-weight:500}
  .flowbtn .ct{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
  #steps{flex:1 1 auto;overflow-y:auto;padding:12px 14px 20px}
  #steps .shd{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .step{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed #182131}
  .step:last-child{border-bottom:none}
  .step .n{font-family:'JetBrains Mono',monospace;font-size:10px;color:#0a0e14;
    background:var(--sc,#a78bfa);min-width:19px;height:19px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:1px}
  .step .b{font-size:12.5px;font-weight:600;line-height:1.25}
  .step .d{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px;font-weight:400}
  #steps::-webkit-scrollbar{width:7px}
  #steps::-webkit-scrollbar-thumb{background:#1c2534;border-radius:4px}

  /* footer */
  #foot{position:absolute;bottom:10px;left:16px;z-index:5;font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--muted);letter-spacing:.05em;display:flex;gap:16px}
  #foot b{color:#aeb9cc;font-weight:600}
  #hint{position:absolute;bottom:10px;right:14px;z-index:5;font-family:'JetBrains Mono',monospace;
    font-size:9.5px;color:var(--muted)}

  /* about: same tokens as the legend, no new colours or fonts */
  #aboutbtn{margin-top:7px;background:rgba(13,18,27,.82);border:1px solid var(--line);
    border-radius:6px;padding:3px 9px;color:var(--muted);cursor:pointer;transition:.18s;
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
  #aboutbtn:hover{border-color:#33415a;color:#c3ccdb}
  #about{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    background:rgba(10,14,20,.72);backdrop-filter:blur(3px);padding:24px}
  #about.on{display:flex}
  #about .card{position:relative;max-width:620px;max-height:84vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:30px 34px 26px}
  #about .card::-webkit-scrollbar{width:7px}
  #about .card::-webkit-scrollbar-thumb{background:#1c2534;border-radius:4px}
  #about .x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);
    cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1;padding:4px}
  #about .x:hover{color:var(--ink)}
  #about .eyebrow{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase}
  #about .kicker{margin:14px 0 0;font-size:18px;font-weight:700;line-height:1.35}
  #about p{margin:11px 0 0;font-size:13.5px;line-height:1.6;color:#c3ccdb}
  #about .lab{margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  #about ul{margin:9px 0 0;padding:0;list-style:none}
  #about li{position:relative;padding-left:15px;margin-top:7px;font-size:13.5px;
    line-height:1.55;color:#c3ccdb}
  #about li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:2px;background:var(--orch)}
  #about .line{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--line);
    font-size:22px;font-weight:700;letter-spacing:.01em}
  #about .note{margin:9px 0 0;font-family:'JetBrains Mono',monospace;font-size:9.5px;
    line-height:1.5;color:var(--muted)}

  /* svg element classes */
  .colhead{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;
    fill:var(--muted);text-transform:uppercase}
  .node-label{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;fill:var(--ink)}
  .node-note{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#8493aa}
  .badge-txt{font-family:'JetBrains Mono',monospace;font-size:8.5px;font-weight:500}
  .gate-txt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;fill:var(--loop)}
  .gate-who{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#c9932f}
  .loop-txt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;fill:var(--loop)}

  .wire{fill:none;stroke-width:1.9;stroke-linecap:round;opacity:.4;
    stroke-dasharray:5 7;animation:flow 2.6s linear infinite}
  .edge.on .wire,.edge.hl .wire{opacity:1;stroke-dasharray:none;stroke-width:2.5;animation:none}
  .loopwire{fill:none;stroke:var(--loop);stroke-width:1.7;opacity:.42;
    stroke-dasharray:7 8;animation:flow 3.4s linear infinite}
  .loop.on .loopwire,.loop.hl .loopwire{opacity:1;stroke-width:2.3}
  .node{cursor:pointer}
  .nbox{transition:opacity .2s}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}

  svg.has-sel .edge:not(.on):not(.hl){opacity:.06}
  svg.has-sel .loop:not(.on):not(.hl){opacity:.06}
  svg.has-sel .node:not(.on):not(.hl){opacity:.14}
  .particle{opacity:.95}

  @media (prefers-reduced-motion: reduce){
    .wire,.loopwire{animation:none}
    .particle{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="title">
      <h1>__TITLE__</h1>
      <p>__SUBTITLE__</p>
      <button id="aboutbtn" aria-haspopup="dialog">About</button>
    </div>
    <div id="legend"></div>
    <svg id="map" viewBox="0 0 2600 1180" preserveAspectRatio="xMidYMid meet" aria-label="Skills map"></svg>
    <div id="foot"></div>
    <div id="hint">CLICK A FLOW · HOVER A NODE</div>
  </div>
  <aside id="side">
    <div class="hd"><div class="cap">End-to-end flows</div><h2>Paths through the map</h2></div>
    <div id="flows"></div>
    <div id="steps"></div>
  </aside>
</div>
<div id="about" role="dialog" aria-modal="true" aria-label="About the Oolio Product OS">
  <div class="card"><button class="x" aria-label="Close">✕</button><div id="aboutbody"></div></div>
</div>

<script>
/*__MAP_DATA__*/
/* ============================================================================
   LAYOUT + RENDER
   ========================================================================== */
const SVGNS="http://www.w3.org/2000/svg";
const NODE_W=176, NODE_H=62, LEFT=150, COLGAP=205, TOP=225, ROWGAP=175;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const svg=document.getElementById("map");
const byId={};
NODES.forEach(n=>{n.cx=LEFT+n.col*COLGAP; n.cy=TOP+n.row*ROWGAP; byId[n.id]=n;});

/* canvas sizes itself to the data, so adding a column or a loop never crops the map */
const MAXROW=Math.max(...NODES.map(n=>n.row));
const ROWS_BOTTOM=TOP+MAXROW*ROWGAP+NODE_H/2;          // lowest node edge
const LOOP_BASE=ROWS_BOTTOM+75, LOOP_STEP=42;          // loops bow below the rows
const CANVAS_W=LEFT+(COLUMNS.length-1)*COLGAP+NODE_W/2+62;
const CANVAS_H=LOOP_BASE+Math.max(0,LOOPS.length-1)*LOOP_STEP+58;
svg.setAttribute("viewBox",`0 0 ${CANVAS_W} ${CANVAS_H}`);

function el(tag,attrs){const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); return e;}

/* ---- defs ---- */
const defs=el("defs",{});
// dot grid
const pat=el("pattern",{id:"dots",width:26,height:26,patternUnits:"userSpaceOnUse"});
pat.appendChild(el("circle",{cx:1.2,cy:1.2,r:1.2,fill:"#141b28"}));
defs.appendChild(pat);
// glow
const f=el("filter",{id:"glow",x:"-40%",y:"-40%",width:"180%",height:"180%"});
f.appendChild(el("feGaussianBlur",{stdDeviation:"2.4",result:"b"}));
const fm=el("feMerge",{});fm.appendChild(el("feMergeNode",{in:"b"}));fm.appendChild(el("feMergeNode",{in:"SourceGraphic"}));
f.appendChild(fm);defs.appendChild(f);
// arrow markers per colour
Object.entries(TYPE_COLOR).concat([["loop","#f5b942"]]).forEach(([k,c])=>{
  const m=el("marker",{id:"arw-"+k,markerWidth:8,markerHeight:8,refX:6.5,refY:3,orient:"auto",markerUnits:"userSpaceOnUse"});
  m.appendChild(el("path",{d:"M0,0 L7,3 L0,6 Z",fill:c}));
  defs.appendChild(m);
});
svg.appendChild(defs);
svg.appendChild(el("rect",{x:0,y:0,width:CANVAS_W,height:CANVAS_H,fill:"url(#dots)"}));

// layers
const gLoops=el("g",{}), gEdges=el("g",{}), gGates=el("g",{}), gNodes=el("g",{}), gPart=el("g",{id:"parts"});
[gLoops,gGates,gEdges,gNodes,gPart].forEach(g=>svg.appendChild(g));

/* ---- column headers ---- */
COLUMNS.forEach((c,i)=>{
  const t=el("text",{x:LEFT+i*COLGAP,y:172,"text-anchor":"middle","class":"colhead"});
  t.textContent=c.toUpperCase();gNodes.appendChild(t);
});

/* ---- anchors + path builder ---- */
function anchors(a,b){
  const dx=b.cx-a.cx;
  if(dx>1){ // forward
    return {x1:a.cx+NODE_W/2,y1:a.cy,x2:b.cx-NODE_W/2,y2:b.cy,dir:"fwd"};
  } else if(Math.abs(dx)<=1){ // same column
    return {x1:a.cx+NODE_W/2,y1:a.cy,x2:b.cx+NODE_W/2,y2:b.cy,dir:"same"};
  } else { // backward
    return {x1:a.cx-NODE_W/2,y1:a.cy,x2:b.cx+NODE_W/2,y2:b.cy,dir:"back"};
  }
}
function edgePath(a,b){
  const k=anchors(a,b);
  if(k.dir==="fwd"){
    const mx=(k.x1+k.x2)/2;
    return `M${k.x1},${k.y1} C${mx},${k.y1} ${mx},${k.y2} ${k.x2},${k.y2}`;
  }
  if(k.dir==="same"){
    const bulge=Math.max(k.x1,k.x2)+64;
    return `M${k.x1},${k.y1} C${bulge},${k.y1} ${bulge},${k.y2} ${k.x2},${k.y2}`;
  }
  // backward: bow upward above the rows
  const topY=Math.min(k.y1,k.y2)-64;
  return `M${k.x1},${k.y1} C${k.x1-70},${topY} ${k.x2+70},${topY} ${k.x2},${k.y2}`;
}

/* ---- edges ---- */
const edgeEls={};
EDGES.forEach((e,i)=>{
  const a=byId[e.f], b=byId[e.t]; if(!a||!b)return;
  const col=TYPE_COLOR[a.type];
  const g=el("g",{"class":"edge","data-f":e.f,"data-t":e.t}); g.dataset.idx=i;
  const d=edgePath(a,b);
  const p=el("path",{d:d,"class":"wire",stroke:col,"marker-end":"url(#arw-"+a.type+")"});
  p.style.setProperty("--c",col);
  g.appendChild(p);
  g._path=d; g._color=col;
  if(e.lbl){
    const mid=midpoint(d);
    const tg=el("g",{});
    const tw=e.lbl.length*5.4+10;
    tg.appendChild(el("rect",{x:mid.x-tw/2,y:mid.y-14,width:tw,height:13,rx:3,fill:"#0d121b",stroke:col,"stroke-opacity":.5}));
    const tt=el("text",{x:mid.x,y:mid.y-4.5,"text-anchor":"middle","font-family":"'JetBrains Mono',monospace","font-size":8,fill:"#b9c3d4"});
    tt.textContent=e.lbl; tg.appendChild(tt);
    g.appendChild(tg);
  }
  gEdges.appendChild(g);
  (edgeEls[e.f+">"+e.t])=g;
});
function midpoint(d){ // sample a cubic roughly at t=0.5 using path API
  const tmp=el("path",{d:d}); const L=tmp.getTotalLength?tmp.getTotalLength():0;
  if(L){const pt=tmp.getPointAtLength(L*0.5);return{x:pt.x,y:pt.y};}
  return{x:0,y:0};
}

/* ---- loops (under the graph) ---- */
const loopEls={};
LOOPS.forEach((lp,i)=>{
  const a=byId[lp.f], b=byId[lp.t]; if(!a||!b)return;
  const depth=LOOP_BASE+i*LOOP_STEP;
  const x1=a.cx, y1=a.cy+NODE_H/2, x2=b.cx, y2=b.cy+NODE_H/2;
  const d=`M${x1},${y1} C${x1},${depth} ${x2},${depth} ${x2},${y2}`;
  const g=el("g",{"class":"loop","data-f":lp.f,"data-t":lp.t});
  g.appendChild(el("path",{d:d,"class":"loopwire","marker-end":"url(#arw-loop)"}));
  g._path=d; g._color="#f5b942";
  const midx=(x1+x2)/2;
  const lw=lp.label.length*6.0+14;
  g.appendChild(el("rect",{x:midx-lw/2,y:depth-9,width:lw,height:16,rx:4,fill:"#0d121b",stroke:"#f5b942","stroke-opacity":.45}));
  const tt=el("text",{x:midx,y:depth+2.5,"text-anchor":"middle","class":"loop-txt"});
  tt.textContent=lp.label; g.appendChild(tt);
  gLoops.appendChild(g);
  loopEls[lp.f+">"+lp.t]=g;
});

/* ---- gates ---- */
GATES.forEach(gt=>{
  const x=LEFT+(gt.after+0.5)*COLGAP;
  const g=el("g",{});
  g.appendChild(el("line",{x1:x,y1:190,x2:x,y2:ROWS_BOTTOM+20,stroke:"#f5b942","stroke-width":1.4,"stroke-dasharray":"3 6","stroke-opacity":.55}));
  g.appendChild(el("circle",{cx:x,cy:204,r:9,fill:"#0d121b",stroke:"#f5b942","stroke-width":1.4}));
  const ck=el("path",{d:`M${x-4},${204} l3,3 l5,-6`,fill:"none",stroke:"#f5b942","stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"});
  g.appendChild(ck);
  const t1=el("text",{x:x,y:232,"text-anchor":"middle","class":"gate-txt"});t1.textContent="⟡ "+gt.label;
  const t2=el("text",{x:x,y:246,"text-anchor":"middle","class":"gate-who"});t2.textContent=gt.who;
  g.appendChild(t1);g.appendChild(t2);
  gGates.appendChild(g);
});

/* ---- nodes ---- */
NODES.forEach(n=>{
  const c=TYPE_COLOR[n.type];
  const x=n.cx-NODE_W/2, y=n.cy-NODE_H/2;
  const g=el("g",{"class":"node","data-id":n.id});
  if(n.desc){const tip=el("title",{});tip.textContent=n.desc;g.appendChild(tip);} // real SKILL.md description
  const box=el("g",{"class":"nbox"});
  box.appendChild(el("rect",{x:x,y:y,width:NODE_W,height:NODE_H,rx:11,fill:"#0e1420",stroke:c,"stroke-opacity":.55,"stroke-width":1.4}));
  box.appendChild(el("rect",{x:x,y:y,width:4,height:NODE_H,rx:2,fill:c})); // accent bar
  const lab=el("text",{x:x+15,y:y+22,"class":"node-label"});lab.textContent=n.label;box.appendChild(lab);
  const nt=el("text",{x:x+15,y:y+37,"class":"node-note"});nt.textContent=n.note;box.appendChild(nt);
  // badge pill
  const bw=n.badge.length*5.1+14;
  const bg=el("g",{});
  bg.appendChild(el("rect",{x:x+15,y:y+43,width:bw,height:13,rx:6.5,fill:c,"fill-opacity":.15,stroke:c,"stroke-opacity":.6}));
  const bt=el("text",{x:x+15+bw/2,y:y+52.5,"text-anchor":"middle","class":"badge-txt",fill:c});
  bt.textContent=n.badge; bg.appendChild(bt);
  box.appendChild(bg);
  g.appendChild(box);
  g.addEventListener("mouseenter",()=>hover(n.id,true));
  g.addEventListener("mouseleave",()=>hover(n.id,false));
  gNodes.appendChild(g);
});

/* ============================================================================
   LEGEND / FLOWS / FOOTER
   ========================================================================== */
const legend=document.getElementById("legend");
legend.innerHTML='<div class="lt">Executor</div><div class="row">'+
  Object.keys(TYPE_LABEL).map(k=>`<span class="k"><span class="dot" style="background:${TYPE_COLOR[k]}"></span>${TYPE_LABEL[k]}</span>`).join("")+
  '</div>';

const flowsBox=document.getElementById("flows");
FLOWS.forEach((fl,i)=>{
  const b=document.createElement("button");
  b.className="flowbtn"; b.dataset.idx=i;
  const ac=getVar(fl.accent);
  b.style.setProperty("--accent",ac);
  b.innerHTML=`<span class="idx">0${i+1}</span><span class="nm">${fl.name}</span><span class="ct">${fl.path.length}</span>`;
  b.addEventListener("click",()=>selectFlow(i));
  flowsBox.appendChild(b);
});
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

document.getElementById("foot").innerHTML=
  `<span><b>${BUILD.skills}</b> skills</span><span><b>${EDGES.length}</b> connections</span>`+
  `<span><b>${GATES.length}</b> gates</span><span><b>${LOOPS.length}</b> loops</span>`+
  (BUILD.unplaced ? `<span style="color:#f87171"><b>${BUILD.unplaced}</b> unplaced</span>` : "")+
  `<span>GENERATED ${BUILD.stamp}</span>`;

/* ---- about ---- */
(function(){
  const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const fill=s=>esc(s).replaceAll("{skills}",BUILD.skills);
  let h=`<div class="eyebrow">${esc(ABOUT.eyebrow||"What this is")}</div>`+
        `<p class="kicker">${fill(ABOUT.kicker)}</p>`;
  (ABOUT.lede||[]).forEach(p=>h+=`<p>${fill(p)}</p>`);
  (ABOUT.sections||[]).forEach(s=>{
    h+=`<div class="lab">${esc(s.label)}</div>`;
    (s.paragraphs||[]).forEach(p=>h+=`<p>${fill(p)}</p>`);
    if(s.list) h+=`<ul>${s.list.map(li=>`<li>${fill(li)}</li>`).join("")}</ul>`;
  });
  if(ABOUT.line) h+=`<p class="line">${fill(ABOUT.line)}</p>`;
  if(ABOUT.footnote) h+=`<p class="note">${fill(ABOUT.footnote)}</p>`;
  document.getElementById("aboutbody").innerHTML=h;

  const box=document.getElementById("about"), btn=document.getElementById("aboutbtn");
  const open=()=>{box.classList.add("on"); box.querySelector(".x").focus();};
  const shut=()=>{box.classList.remove("on"); btn.focus();};
  btn.addEventListener("click",open);
  box.querySelector(".x").addEventListener("click",shut);
  box.addEventListener("click",e=>{ if(e.target===box) shut(); });   // click the backdrop, not the card
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&box.classList.contains("on")) shut(); });
})();

/* ============================================================================
   INTERACTION
   ========================================================================== */
let current=-1;
function edgeKey(f,t){return f+">"+t;}
function pathLinks(fl){ // consecutive pairs, as edges or as loop wires, either direction
  const out=[];
  for(let i=0;i<fl.path.length-1;i++){
    const a=fl.path[i][0], b=fl.path[i+1][0];
    const g = edgeEls[edgeKey(a,b)] || edgeEls[edgeKey(b,a)]
           || loopEls[edgeKey(a,b)] || loopEls[edgeKey(b,a)];
    if(g) out.push(g);
  }
  return out;
}
function clearParts(){document.getElementById("parts").innerHTML="";}
function clearState(){
  svg.classList.remove("has-sel");
  document.querySelectorAll(".edge,.loop,.node").forEach(e=>e.classList.remove("on","hl"));
  clearParts();
}
function selectFlow(i){
  clearState();
  current=i;
  document.querySelectorAll(".flowbtn").forEach(b=>b.classList.toggle("on",+b.dataset.idx===i));
  const fl=FLOWS[i];
  svg.classList.add("has-sel");
  // nodes
  fl.path.forEach(p=>{const nd=document.querySelector(`.node[data-id="${p[0]}"]`);if(nd)nd.classList.add("on");});
  // edges, loop wires + particles
  pathLinks(fl).forEach(g=>{
    g.classList.add("on");
    if(!reduce) addParticle(g._path,g._color);
  });
  renderSteps(fl);
}
function addParticle(d,color){
  const parts=document.getElementById("parts");
  const c=el("circle",{r:3.2,fill:color,"class":"particle",filter:"url(#glow)"});
  const am=el("animateMotion",{dur:(1.6+Math.random()*0.8)+"s",repeatCount:"indefinite",path:d,rotate:"0"});
  c.appendChild(am); parts.appendChild(c);
  // trailing dot
  const c2=el("circle",{r:1.8,fill:color,"class":"particle","fill-opacity":.6});
  const am2=el("animateMotion",{dur:am.getAttribute("dur"),repeatCount:"indefinite",path:d,begin:"-0.25s"});
  c2.appendChild(am2); parts.appendChild(c2);
}
function renderSteps(fl){
  const box=document.getElementById("steps");
  const ac=getVar(fl.accent);
  let h=`<div class="shd">${fl.name} · ${fl.path.length} steps</div>`;
  fl.path.forEach((p,i)=>{
    h+=`<div class="step"><div class="n" style="--sc:${ac}">${i+1}</div>`+
       `<div><div class="b">${p[1]}</div><div class="d">${p[2]}</div></div></div>`;
  });
  box.innerHTML=h;
}

/* hover — lights incident edges even while a flow is selected */
function hover(id,on){
  if(on){
    const nd=document.querySelector(`.node[data-id="${id}"]`); if(nd)nd.classList.add("hl");
    document.querySelectorAll(`.edge[data-f="${id}"],.edge[data-t="${id}"]`).forEach(g=>{
      g.classList.add("hl");
      const f=g.getAttribute("data-f"),t=g.getAttribute("data-t");
      const other=f===id?t:f;
      const on2=document.querySelector(`.node[data-id="${other}"]`); if(on2)on2.classList.add("hl");
    });
    document.querySelectorAll(`.loop[data-f="${id}"],.loop[data-t="${id}"]`).forEach(g=>g.classList.add("hl"));
    if(current<0) svg.classList.add("has-sel");
  } else {
    document.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl"));
    if(current<0) svg.classList.remove("has-sel");
  }
}

/* auto-select the longest flow ~1s after load */
let longest=0; FLOWS.forEach((f,i)=>{if(f.path.length>FLOWS[longest].path.length)longest=i;});
window.addEventListener("load",()=>{ setTimeout(()=>selectFlow(longest),1000); });
</script>
