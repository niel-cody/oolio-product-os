<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Working">
  <title>Working</title>
  <!-- The signature animation, and the only one the identity has: the bead runs the ring and
       returns to the break. Used for loading and long-running work, never as decoration.
       Reduced motion holds it still at the break, which is the resting mark. -->
  <path d="M26.76 13.713A11 11 0 1 1 18.287 5.24" fill="none" stroke="currentColor"
        stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <g>
    <circle cx="23.778" cy="8.222" r="3" fill="#FFE800"/>
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16"
                      dur="1.6s" repeatCount="indefinite"/>
  </g>
  <style>
    @media (prefers-reduced-motion: reduce) { animateTransform { display: none } }
  </style>
</svg>
